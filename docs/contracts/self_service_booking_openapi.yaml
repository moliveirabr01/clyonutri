openapi: 3.0.3
info:
  title: ClyoNutri II — API de Autoagendamento Self-Service (NI2-433 / NI2-434)
  description: Contrato unificado de autoagendamento para portal web público, aplicativo do paciente e agenda operacional.
  version: 1.1.0
  # 1.1.0 (20/10/2026): clínica e duração derivadas do profissional; opt-in por clínica (404 BOOKING_NOT_AVAILABLE);
  # limite por IP (429 RATE_LIMITED); aceite do termo clinical_care na confirmação; CPF não é coletado.
servers:
  - url: /api/v1
    description: API v1 de Autoagendamento ClyoNutri

paths:
  /booking/slots:
    get:
      summary: Consulta horários disponíveis de um profissional em uma data
      operationId: getAvailableSlots
      parameters:
        - name: clinic_id
          in: query
          required: false
          schema:
            type: integer
          description: Opcional. Se enviado, precisa ser a clínica do profissional (senão 404).
        - name: professional_id
          in: query
          required: true
          schema:
            type: integer
          description: ID do profissional nutricionista
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-10-20"
          description: Data da consulta (AAAA-MM-DD)
        - name: modality
          in: query
          required: false
          schema:
            type: string
            enum: [presential, telehealth]
            default: presential
          description: Modalidade presencial ou teleconsulta
      responses:
        '200':
          description: Lista de slots disponíveis retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  clinic_id:
                    type: integer
                  professional_id:
                    type: integer
                  date:
                    type: string
                  duration_minutes:
                    type: integer
                  available_slots:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          example: "09:00"
                        scheduled_at:
                          type: string
                          format: date-time
                          example: "2026-10-20 09:00:00"
                        available:
                          type: boolean
                          example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/BookingNotAvailable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /booking/holds:
    post:
      summary: Cria reserva temporária de horário com TTL de 15 minutos (Hold)
      operationId: createBookingHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - professional_id
                - scheduled_at
              properties:
                clinic_id:
                  type: integer
                  description: Opcional; se enviado, deve ser a clínica do profissional.
                professional_id:
                  type: integer
                scheduled_at:
                  type: string
                  description: Precisa ser um dos horários devolvidos por /booking/slots (AAAA-MM-DD HH:MM[:SS]).
                  example: "2026-10-20 09:00:00"
                service_type:
                  type: string
                  enum: [first_visit, follow_up]
                  default: first_visit
                modality:
                  type: string
                  enum: [presential, telehealth]
                  default: presential
                  description: Precisa estar liberada pela clínica.
                idempotency_key:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_.:-]+$'
                  description: Mesma chave + hold ativo = mesma reserva (200, idempotent_replay=true). A duração vem do cadastro do profissional.
      responses:
        '200':
          description: Repetição com a mesma idempotency_key (mesma reserva)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHold'
        '201':
          description: Reserva temporária criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHold'
        '404':
          $ref: '#/components/responses/BookingNotAvailable'
        '409':
          description: SLOT_UNAVAILABLE — horário fora da disponibilidade, ocupado ou reservado por outra pessoa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /booking/confirm:
    post:
      summary: Confirma a reserva temporária e converte no agendamento canônico (appointments)
      operationId: confirmBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hold_token
                - name
                - terms_accepted
                - consent_term_id
              description: Exige nome e ao menos um contato (email ou phone).
              properties:
                hold_token:
                  type: string
                  example: "a1b2c3d4e5f6..."
                name:
                  type: string
                  example: "Maria Santos"
                email:
                  type: string
                  format: email
                  example: "maria.santos@email.com"
                phone:
                  type: string
                  example: "(11) 98765-4321"
                terms_accepted:
                  type: boolean
                  description: Aceite explícito do termo clinical_care vigente.
                consent_term_id:
                  type: integer
                  description: Id do termo exibido ao paciente; versão diferente da vigente = 422.
                notes:
                  type: string
                  example: "Primeira consulta para reeducação alimentar."
      responses:
        '200':
          description: Agendamento canônico confirmado e persistido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  appointment_id:
                    type: integer
                    example: 1042
                  status:
                    type: string
                    example: "scheduled"
                  scheduled_at:
                    type: string
                    format: date-time
                    example: "2026-10-20 09:00:00"
                  duration_minutes:
                    type: integer
                    example: 60
                  modality:
                    type: string
                    example: "presential"
                  teleconsultation_ready:
                    type: boolean
                    example: false
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '410':
          description: HOLD_EXPIRED — reserva vencida, liberada ou inexistente para confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflito detectado no fechamento da reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /booking/release:
    post:
      summary: Libera voluntariamente uma reserva temporária antes do TTL
      operationId: releaseBookingHold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hold_token
              properties:
                hold_token:
                  type: string
      responses:
        '200':
          description: Reserva liberada; slot devolvido de imediato
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  released:
                    type: boolean
                    example: true

  # NI2-137: cancelar, pedir remarcação e confirmar a própria consulta são da API do paciente.
  # Contrato único (schemas, códigos de erro e operationIds): docs/api/openapi_v1.json, tag "Consultas".

components:
  schemas:
    BookingHold:
      type: object
      properties:
        hold_token:
          type: string
          example: "7f8a9b0c1d2e3f..."
        status:
          type: string
          enum: [held, converted, expired, released]
          example: "held"
        scheduled_at:
          type: string
          format: date-time
          example: "2026-10-20 09:00:00"
        duration_minutes:
          type: integer
          example: 60
        expires_at_utc:
          type: string
          format: date-time
          example: "2026-10-16 11:15:00"
        ttl_seconds_remaining:
          type: integer
          example: 900
        payment_status:
          type: string
          enum: [not_required, pending, paid, waived]
          example: "not_required"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Conflito de agenda ou reserva expirada."
        code:
          type: string
          enum: [SLOT_UNAVAILABLE, HOLD_EXPIRED, MIN_ADVANCE_VIOLATION, OUTSIDE_WORKING_HOURS, FORBIDDEN_TENANT_ACCESS, APPOINTMENT_NOT_FOUND, UNPROCESSABLE_ENTITY]
          example: "SLOT_UNAVAILABLE"
        correlation_id:
          type: string
          example: "clyo-bk-67123abc"

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Acesso proibido por isolamento de tenant ou paciente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Regra de negócio ou política violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BookingNotAvailable:
      description: BOOKING_NOT_AVAILABLE — profissional inexistente, inativo, de outra clínica ou com autoagendamento desligado (sem distinguir o motivo)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED — muitas tentativas do mesmo IP (slots 120, holds 10, confirmações 20 a cada 10 min)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
